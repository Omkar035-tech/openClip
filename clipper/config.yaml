general:
  output_dir: out
  cache_dir: cache
  temp_dir: /tmp/clipper_work
  n_clips: 5
models:
  whisper_backend: mlx
  whisper_model: mlx-community/whisper-large-v3-turbo
  fallback_whisper_model: base.en
  gemini_model: gemini-2.5-flash
  ollama_model: qwen2.5:7b-instruct
  visual_verify: false
clip:
  layout: podcast_vertical
  target_duration: 65.0
  min_duration: 35.0
  max_duration: 120.0
  resolution:
  - 1080
  - 1350
  fps: 30
  aspect_ratio: '4:5'
  cam_placement: top
  streamer_mode: auto
  manual_cam_box: null
captions:
  style: bold-pop
  font_dir: fonts
  font_file: BebasNeue-Regular.ttf
  font_size: 74
  max_safe_width: 920
  primary_color: '#ffffff'
  active_color: '#f59e0b'
  stroke_color: '#000000'
  stroke_width: 8
  vertical_position_ratio: 0.7
  max_words_per_phrase: 3
  karaoke_pop_scale: 1.1
  show_title_card: true
  title_card_duration: 2.2
  emphasis_color: '#fcd34d'
  rotation_angle: 2.0
  bg_mode: word
  bg_color: '#1a1612'
  bg_radius: 10
  fade_duration: 0.12
  auto_detect_emphasis: true
camera:
  detector: mediapipe
  smoothing_alpha: 0.08
  deadband_px: 16
  hook_zoom: 1.12
  punch_zoom: 1.2
  pacing_seconds: 3.5
effects:
  white_flash: true
  flash_frames: 3
  progress_bar: true
  progress_bar_color: '#FFD400'
  progress_bar_height: 8
  vignette: true
  sfx_on_punch: true
music:
  enabled: true
  library_dir: music_library
  level_db: -22.0
  ducking_threshold_db: -30.0
  ducking_ratio: 7.0
  ducking_attack_ms: 20
  ducking_release_ms: 300
  highpass_hz: 60.0
  speech_dip_hz: 2500.0
  fade_in_sec: 0.6
  fade_out_sec: 1.2
  generate: false
audio:
  voice_highpass_hz: 80.0
  voice_denoise: true
  target_lufs: -14.0
  max_true_peak: -1.0
performance:
  whisper_hardware: auto
  render_hardware: auto
  cpu_threads: 4
  render_workers: 2
