[project]
name = "clipper"
version = "0.1.0"
description = "Fast, reusable, open-source podcast-to-viral-short clipping engine for Apple Silicon M4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
    "mlx-whisper>=0.4.0",
    "google-genai>=0.1.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "mediapipe>=0.10.0",
    "httpx>=0.24.0",
]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
