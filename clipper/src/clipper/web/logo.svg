<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#131722" rx="16" />
  <defs>
    <linearGradient id="clipGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="50%" stop-color="#00ddff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
  </defs>
  
  <!-- Stylized OC Paperclip Icon -->
  <g transform="translate(85, 100) rotate(-35)">
    <!-- Outer 'C' clip curve -->
    <path d="M 30 -30 L -25 -30 A 32 32 0 0 0 -25 34 L 15 34" fill="none" stroke="url(#clipGradient)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Inner 'O' clip loop -->
    <path d="M -15 -8 L 20 -8 A 12 12 0 0 1 20 16 L -15 16 A 12 12 0 0 1 -15 -8 Z" fill="none" stroke="url(#clipGradient)" stroke-width="10" stroke-linecap="round" />
          
    <!-- Open snap/spark details -->
    <line x1="42" y1="-12" x2="52" y2="-22" stroke="#00ddff" stroke-width="4" stroke-linecap="round" />
    <line x1="46" y1="2" x2="58" y2="4" stroke="#00ddff" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="18" x2="44" y2="28" stroke="#00ddff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="165" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="600" fill="#ffffff" letter-spacing="-1.5">
    open<tspan fill="url(#textGradient)">Clip</tspan>
  </text>
</svg>
